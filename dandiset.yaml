datePublished: '2026-10-12T09:21:28.419436+00:00'
description: This dataset contains chronic neurochemical and electrophysiological
  recordings from the striatum of an adult female rhesus monkey (Macaca mulatta; Monkey
  T) implanted with an aseptic, semi-sealed cranial chamber, collected by the Schwerdt
  Lab at the University of Pittsburgh. It includes the processed data published on
  Zenodo (https://doi.org/10.5281/zenodo.14825992) together with the raw recordings
  from which they were derived. Recordings were made while the monkey performed a
  reward-biased eye movement task, in which the animal fixates a central cue, is shown
  a value cue signaling a large or small reward, and makes a saccade to a left or
  right target to obtain reward. Electrophysiology was acquired with a Neuralynx Digital
  Lynx SX system through a unity-gain headstage (HS-36, ±1 mV input range) at 32 kHz,
  bandpass filtered 0.1–7500 Hz. FSCV was performed with a triangular waveform applied
  at 10 Hz, with current sampled at 25 kHz. The session (09/27/2024) includes raw
  broadband electrophysiology from sites c7b, c5c and c5d; a bipolar beta-band LFP
  (c7b referenced to c5c, 1 kHz, 60 s per trial centered on initial cue onset); threshold-detected
  spikes with 48-sample waveforms and spike-sorted units (Plexon Offline Sorter) from
  site c5d; and raw FSCV current and applied voltage from site c8ds together with
  trial-aligned, PCA-extracted dopamine, pH, motion, and oxidation current (at 0.6
  V) time series (10 Hz, 60 s per trial). Behavioral data are stored as a trials table
  with trial types and an annotated events table of task events (e.g., fixation onset,
  value cue onset, reward delivery, and error types) decoded from 8-bit Neuralynx
  event codes. The Neuralynx and FSCV systems were synchronized using shared trial-start
  event codes, and all data are expressed relative to the start of the Neuralynx recording.
